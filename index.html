<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Leads CRM</title>
<style>
:root{--bg:#FBF4E9;--card:#fff;--tx:#021137;--mu:#6c7491;--ln:#efe3d0;--ac:#034BFF;--soft:#F8E8D2;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#021137;--card:#0b1d4d;--tx:#F8E8D2;--mu:#9aa5c9;--ln:#16296a;--ac:#4d7dff;--soft:#13266a;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.45 'Inter',system-ui,-apple-system,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#app{max-width:640px;margin:0 auto;padding:0 12px 90px}
header{position:sticky;top:0;background:var(--bg);padding:12px 0 8px;z-index:5}
h1{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
h1 button{font-size:13px;background:var(--soft);border:0;color:var(--tx);border-radius:10px;padding:7px 12px}
input[type=search],textarea,input[type=date]{width:100%;padding:13px 14px;border:0;border-radius:14px;background:var(--card);color:var(--tx);font:inherit;box-shadow:0 1px 2px #02113714}input::placeholder,textarea::placeholder{color:var(--mu)}
.sel{display:flex;gap:8px;margin-top:8px}.sel select{flex:1;min-width:0;padding:11px;border:0;border-radius:12px;box-shadow:0 1px 2px #02113714;background:var(--card);color:var(--tx);font:inherit;font-size:14px}.sel select.on{color:var(--ac);font-weight:600}.chips{display:flex;gap:10px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--soft);color:var(--tx);padding:8px 14px;border-radius:99px;font:inherit;font-size:14px}
.chip.on{background:var(--ac);color:#fff}
.chip b{opacity:.7;font-weight:600;margin-left:4px}
.card{background:var(--card);border-radius:14px;padding:18px 18px;margin:14px 0;display:flex;gap:14px;align-items:center;box-shadow:0 1px 2px #02113712,0 4px 14px #0211370a}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.info{flex:1;min-width:0}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{margin-top:3px;font-size:13px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wa{flex:none;width:44px;height:44px;border-radius:50%;background:#25d366;display:grid;place-items:center;text-decoration:none;font-size:22px}
.more{width:100%;padding:14px;border:0;background:var(--soft);color:var(--mu);border-radius:12px;font:inherit;margin-top:6px}
#ov{position:fixed;inset:0;background:#0007;display:none;z-index:9}
#sh{position:fixed;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto}
#sh h2{margin:0;font-size:20px}
.big{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0}
.big a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 4px;border-radius:14px;text-decoration:none;color:#fff;font-weight:600;font-size:14px}
.big a span{font-size:24px}
.lb{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px}
.st{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st button{padding:13px;border-radius:12px;border:0;background:var(--soft);background:var(--card);color:var(--tx);font:inherit;font-weight:600}
.st button.on{color:#fff}
.tag{display:inline-block;background:var(--soft);color:var(--tx)!important;border-radius:8px;padding:3px 8px;font-size:12px;margin:2px 4px 2px 0;color:var(--mu)}
.x{float:right;background:var(--soft);border:0;border-radius:50%;width:34px;height:34px;font-size:18px;color:var(--tx)}
.help{background:var(--soft);border:0;border-radius:14px;padding:14px;margin:8px 0;font-size:14px;color:var(--mu)}
.help b{color:var(--tx)}
@media(min-width:900px){
#app{max-width:1180px;padding:0 32px 48px}
header{padding:24px 0 12px}
h1{font-size:26px;margin-bottom:14px}
h1 button{font-size:14px;padding:8px 14px;cursor:pointer}
.top{display:flex;gap:12px;align-items:center}
.top input[type=search]{flex:1}
.sel{margin:0;flex:none}.sel select{flex:none;width:250px;cursor:pointer}
.chips{flex-wrap:wrap;overflow:visible;padding:14px 0 4px}
.chip{cursor:pointer}.chip:hover{border-color:var(--ac)}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:0 18px}
#list .more,#list>p{grid-column:1/-1}
.card{cursor:pointer;margin:0 0 16px;transition:.15s}.card:hover{border-color:var(--ac);transform:translateY(-1px);box-shadow:0 4px 14px #0001}
#ov{background:#0006;backdrop-filter:blur(2px)}
#sh{left:50%;right:auto;top:50%;bottom:auto;transform:translate(-50%,-50%);width:540px;max-width:92%;max-height:88%;border-radius:20px;margin:0}
.big a,.st button{cursor:pointer}
}
.big a{box-shadow:0 2px 8px #0211371f}.wa{box-shadow:0 2px 8px #25d36655}

.tabs{display:flex;background:var(--soft);border-radius:14px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:none;color:var(--mu);padding:10px;border-radius:11px;font:inherit;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px #0211371f}
#dash{padding-top:6px}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{background:var(--card);border-radius:16px;padding:16px 18px;box-shadow:0 1px 2px #02113712,0 4px 14px #0211370a}
.kpi b{display:block;font-size:30px;line-height:1.1;letter-spacing:-.02em}
.kpi span{font-size:13px;color:var(--mu)}
.kpi.hl{background:var(--ac)}.kpi.hl b,.kpi.hl span{color:#fff}
.pn{background:var(--card);border-radius:16px;padding:18px;margin-top:14px;box-shadow:0 1px 2px #02113712,0 4px 14px #0211370a}
.pn h3{margin:0 0 14px;font-size:15px}
.pn h3 small{font-weight:400;color:var(--mu);font-size:12px;margin-left:6px}
.ring{display:flex;align-items:center;gap:18px}
.ring svg{flex:none}
.ring .lg div{margin:6px 0;font-size:14px}.ring .lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.br{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:14px}
.br em{font-style:normal;width:86px;flex:none}.br .tr{flex:1;height:12px;background:var(--soft);border-radius:99px;overflow:hidden}.br .tr i{display:block;height:100%;border-radius:99px}.br b{width:40px;text-align:right}
.bars{position:relative;height:136px;display:flex;gap:6px;align-items:flex-end;border-bottom:1px solid var(--ln)}
.bars .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.bars .col span{font-size:11px;color:var(--mu);height:16px}
.bars .col i{width:100%;max-width:30px;border-radius:6px 6px 0 0;background:var(--soft);min-height:3px}
.bars .col i.on{background:var(--ac)}
.bars .col i.tdy{background:var(--ac)}
.bars .avg{position:absolute;left:0;right:0;border-top:2px dashed #e9a23b;pointer-events:none}
.bars .avg u{position:absolute;right:0;top:-20px;font-size:11px;text-decoration:none;color:#e9a23b;font-weight:600;background:var(--card);padding:0 4px}
.lbl{display:flex;gap:6px;margin-top:6px}.lbl div{flex:1;text-align:center;font-size:10px;color:var(--mu);line-height:1.2}.lbl div.t{color:var(--ac);font-weight:700}
@media(min-width:900px){.tabs{max-width:340px}.kp{grid-template-columns:repeat(4,1fr);gap:16px}.dg{display:grid;grid-template-columns:1fr 1fr;gap:16px}.dg .pn{margin-top:16px}.bars{height:170px}}

 document.getElementById('chips').innerHTML=['Todos','Hoje',...ST.map(x=>x[0])].map(k=>`<button class="chip ${f===k?'on':''}" onclick="f='${k}';pg=1;render()">${k==='Hoje'?'🔔 Retornar':k}<b>${c[k]}</b></button>`).join('');
 const t=today();
 let r=D.filter(l=>{
  if(f==='Hoje'){if(!(S[l[0]]&&S[l[0]].f&&S[l[0]].f<=t))return false}
  else if(f!=='Todos'&&st(l[0])!==f)return false;
  if(fc&&!cs(l).includes(fc))return false;if(fo&&l[6]!==fo)return false;
  return !q||(l[1]+l[2]+l[4]+l[5]+l[6]).toLowerCase().includes(q)});
 document.getElementById('fc').className=fc?'on':'';document.getElementById('fo').className=fo?'on':'';
 const h=document.getElementById('help');
 h.style.display=localStorage.getItem('hid')?'none':'block';
 h.innerHTML='<b>Como usar:</b> toque num lead → fale por WhatsApp/ligação → marque o status. Use 🔔 para agendar retorno. <u onclick="localStorage.setItem(\'hid\',1);render()">Entendi</u>';
 const v=r.slice(0,pg*PER);
 document.getElementById('list').innerHTML=v.map(l=>`<div class="card" onclick="openL(${l[0]})"><span class="dot" style="background:${col(st(l[0]))}"></span><div class="info"><div class="nm">${esc(l[1]||l[2]||l[4])}</div><div class="sub">${esc(l[5]||l[6])}</div></div>${l[2]?`<a class="wa" href="https://wa.me/${dig(l[2])}" target="_blank" onclick="event.stopPropagation();quick(${l[0]})">💬</a>`:''}</div>`).join('')+(r.length>v.length?`<button class="more" onclick="pg++;render()">Ver mais (${r.length-v.length})</button>`:'')+(r.length?'':'<p style="text-align:center;color:var(--mu)">Nada por aqui 🙂</p>');
}
function quick(i){if(st(i)==='Novo')setS(i,'Chamei',1)}
function setS(i,s,nr){const o=S[i]=Object.assign(S[i]||{},{s});if(s==='Novo')delete o.c;else if(!o.c)o.c=today();save(i);if(!nr)openL(i);render()}
function openL(i){cur=i;const l=D[i],o=S[i]||{};
 const sh=document.getElementById('sh');
 sh.innerHTML=`<button class="x" onclick="closeSh()">✕</button><h2>${esc(l[1]||'(sem nome)')}</h2>
 <div class="sub" style="white-space:normal">${esc(l[2])} ${l[4]?'· '+esc(l[4]):''}</div>
 <div class="big">${l[2]?`<a style="background:#25d366" href="https://wa.me/${dig(l[2])}" target="_blank" onclick="quick(${i})"><span>💬</span>WhatsApp</a><a style="background:#034BFF" href="tel:+${dig(l[2])}"><span>📞</span>Ligar</a>`:''}${l[4]?`<a style="background:#021137" href="mailto:${esc(l[4])}"><span>✉️</span>E-mail</a>`:''}</div>
 <div class="lb">Status</div><div class="st">${ST.map(s=>`<button class="${st(i)===s[0]?'on':''}" style="${st(i)===s[0]?'background:'+s[1]:''}" onclick="setS(${i},'${s[0]}')">${s[0]}</button>`).join('')}</div>
 <div class="lb">🔔 Retornar em</div><input type="date" value="${o.f||''}" onchange="S[${i}]=Object.assign(S[${i}]||{},{f:this.value});save(${i});render()">
 <div class="lb">Anotações</div><textarea rows="3" placeholder="Ex: pediu para ligar à tarde…" onchange="S[${i}]=Object.assign(S[${i}]||{},{n:this.value});save(${i})">${esc(o.n||'')}</textarea>
 <div class="lb">Interesses</div>${l[5].split(';').filter(x=>x.trim()).map(x=>`<span class="tag">${esc(x.trim())}</span>`).join('')||'—'}
 <div class="lb">Origem · último contato</div><div class="sub">${esc(l[6])} · ${esc(l[7]||'—')}${l[8]?' · já foi cliente':''}</div>`;
 document.getElementById('ov').style.display='block'}
function closeSh(){document.getElementById('ov').style.display='none';render()}
function menu(){
 const sh=document.getElementById('sh');
 sh.innerHTML=`<button class="x" onclick="closeSh()">✕</button><h2>Backup</h2><p class="sub" style="white-space:normal">Seus status e notas ficam salvos neste aparelho. Baixe uma cópia de vez em quando.</p><div class="st"><button onclick="exp()">⬇️ Exportar CSV</button><button onclick="document.getElementById('imp').click()">⬆️ Restaurar</button></div><input id="imp" type="file" accept=".json" hidden onchange="imp(this)"><button class="more" onclick="bk()">Baixar backup (.json)</button>`;
 document.getElementById('ov').style.display='block'}
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
function bk(){dl('crm-backup.json',JSON.stringify(S),'application/json')}
function imp(el){const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();Object.keys(S).forEach(k=>push(k));closeSh()}catch(e){alert('Arquivo inválido')}};r.readAsText(el.files[0])}
function exp(){const q=s=>'"'+String(s||'').replace(/"/g,'""')+'"';dl('leads.csv','\ufeff'+['Nome,Telefone,Email,Cursos,Origem,Status,Retornar,Notas,Contatado em'].concat(D.map(l=>[l[1],l[2],l[4],l[5],l[6],st(l[0]),(S[l[0]]||{}).f,(S[l[0]]||{}).n,(S[l[0]]||{}).c].map(q).join(','))).join('\n'),'text/csv')}
initSel();render();sync();
</script></body></html>
